<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">

<title>لوحة الخادم | إعداد الخدام</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* خاص بلوحة الخادم */
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.wrap-d{flex:1;width:100%;max-width:520px;margin-inline:auto;padding:var(--s-3) var(--gut) 0;display:grid;gap:var(--s-4);align-content:start}
.p-top{position:sticky;top:var(--s-3);z-index:20;display:flex;align-items:center;gap:var(--s-2);padding:var(--s-2);border-radius:20px}
.p-top b{flex:1;font-size:1rem;font-weight:500}
.ibtn{width:44px;height:44px;flex:none;display:grid;place-items:center;border:0;border-radius:14px;background:var(--glass-2);color:var(--on-glass);cursor:pointer}
.ibtn:hover{background:var(--glass-3)}
.ibtn .icon{width:20px;height:20px}
.pane{padding:var(--s-5) var(--s-4)}
.pane h2{font-size:1rem;font-weight:500;margin-bottom:var(--s-1)}
.sub{font-size:.8rem;line-height:1.7;color:var(--on-glass-2)}

/* اختيار الفترة والترتيب: كبسولات زي فلاتر المخدومين */
.seg{display:flex;gap:var(--s-2);overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--glass-line-soft);background:var(--glass-2);color:var(--on-glass-2);font:inherit;font-size:.86rem;cursor:pointer;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.seg button b{font-weight:500;font-variant-numeric:tabular-nums}
.seg button[aria-pressed=true]{background:var(--btn-light);color:var(--ink);border-color:transparent}

/* حضور الكل: جملة، وعمود لكل جلسة طوله على قد عدد اللي حضروا */
.headline{font-size:1.3rem;font-weight:300;line-height:1.5}
.headline b{font-weight:500;font-variant-numeric:tabular-nums}
.strip{display:flex;align-items:flex-end;gap:3px;height:96px;margin-top:var(--s-5);padding-bottom:2px;border-bottom:1px solid var(--glass-line-soft)}
.strip i{flex:1;max-width:22px;min-height:3px;border-radius:4px 4px 1px 1px;background:rgba(255,248,238,.55)}
.strip i.mass{background:var(--gold-soft)}
.strip-axis{display:flex;justify-content:space-between;margin-top:6px;font-size:.75rem;color:var(--on-glass-3)}
.key{display:flex;flex-wrap:wrap;gap:var(--s-2) var(--s-4);margin-top:var(--s-3);font-size:.78rem;color:var(--on-glass-2)}
.key span{display:inline-flex;align-items:center;gap:6px}
.key i{width:10px;height:10px;border-radius:3px;background:rgba(255,248,238,.55)}
.key i.mass{background:var(--gold-soft)}

/* نسبة كل نوع نشاط */
.types{display:grid;gap:var(--s-3);margin-top:var(--s-4)}
.t-row{display:grid;grid-template-columns:64px 1fr 44px;align-items:center;gap:var(--s-3);font-size:.88rem}
.t-row small{display:block;font-size:.75rem;color:var(--on-glass-3)}
.t-bar{height:8px;border-radius:4px;background:rgba(255,248,238,.12);overflow:hidden}
.t-bar span{display:block;height:100%;border-radius:4px;background:var(--on-glass)}
.t-row b{font-weight:500;font-variant-numeric:tabular-nums;text-align:left}
.t-row.none{color:var(--on-glass-3)}

/* القائمة */
.list-h{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s-3);margin-bottom:var(--s-3)}
.list-h h2{margin:0}
.list{padding:var(--s-2)}
.m{border-radius:16px;transition:background var(--t-fast)}
.m + .m{margin-top:2px}
.m.open{background:var(--glass-2)}
.m-btn{display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:var(--s-3);width:100%;min-height:62px;padding:8px var(--s-2);border:0;border-radius:16px;background:none;color:inherit;font:inherit;text-align:start;cursor:pointer}
.m-btn:hover{background:var(--glass-2)}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--glass-3);font-size:.82rem;font-weight:500}
.m-name{display:block;font-size:.98rem;line-height:1.4}
.m-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:.78rem;color:var(--on-glass-2);font-variant-numeric:tabular-nums}
.flag{display:inline-flex;align-items:center;gap:4px;padding:1px 9px;border-radius:999px;font-size:.75rem;font-weight:500;background:rgba(242,179,90,.2);color:#FFD9A0}
.ring{--p:0;position:relative;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--on-glass) calc(var(--p) * 1%),rgba(255,248,238,.14) 0)}
.ring::before{content:"";position:absolute;inset:3px;border-radius:50%;background:rgba(40,27,18,.72)}
.ring span{position:relative;font-size:.78rem;font-weight:500;font-variant-numeric:tabular-nums}
.ring.low{background:conic-gradient(var(--warn) calc(var(--p) * 1%),rgba(255,248,238,.14) 0)}
.ring.na{background:rgba(255,248,238,.1)}

/* تفاصيل المخدوم: بتتفتح تحت اسمه */
.m-more{display:none;padding:var(--s-2) var(--s-3) var(--s-4);gap:var(--s-4)}
.m.open .m-more{display:grid}
.m-more h3{font-size:.82rem;font-weight:400;color:var(--on-glass-2);margin-bottom:var(--s-2)}
.mini{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s-2)}
.mini div{padding:8px 4px;border-radius:12px;background:rgba(255,248,238,.07);text-align:center}
.mini b{display:block;font-size:1rem;font-weight:500;font-variant-numeric:tabular-nums}
.mini span{font-size:.75rem;color:var(--on-glass-2)}
.bars{display:grid;grid-template-columns:repeat(6,1fr);gap:var(--s-3);align-items:end;height:120px}
.bar{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px}
.bar i{display:block;width:100%;max-width:30px;border-radius:7px 7px 3px 3px;background:rgba(255,248,238,.55);min-height:4px}
.bar.now i{background:var(--gold-soft)}
.bar em{font-style:normal;font-size:.75rem;font-variant-numeric:tabular-nums;color:var(--on-glass-2)}
.bar span{font-size:.75rem;color:var(--on-glass-2);white-space:nowrap}
.bar.none i{background:rgba(255,248,238,.1)}
.manual-t{font-size:.86rem;line-height:1.75;color:var(--on-glass-2)}
.manual-t b{color:var(--on-glass);font-weight:500}
.m-acts{display:flex;flex-wrap:wrap;gap:var(--s-2)}
.wa{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 16px;border-radius:999px;background:#1F7A4D;color:#fff;font-size:.84rem;font-weight:500}
.wa:hover{background:#238a57}
.wa .icon,.go .icon{width:18px;height:18px}
.go{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 16px;border-radius:999px;background:var(--glass-2);border:1px solid var(--glass-line-soft);color:var(--on-glass);font-size:.84rem}
.go:hover{background:var(--glass-3)}
.no-match{padding:var(--s-6) var(--s-3);text-align:center;font-size:.9rem;line-height:1.8;color:var(--on-glass-2)}
.note-off{font-size:.78rem;color:var(--on-glass-3);text-align:center}

/* مفيش جلسات في الفترة دي */
.empty-p{display:none}
[data-empty] .empty-p{display:block}
[data-empty] .has-data{display:none}
</style>
</head>

<script src="assets/attend-demo.js"></script>
<script>
(() => {
  const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const body = document.body, D = window.AttendDemo;
  const fShort = new Intl.DateTimeFormat('ar-EG-u-nu-latn', { day: 'numeric', month: 'short' });
  const fMonth = new Intl.DateTimeFormat('ar-EG-u-nu-latn', { month: 'short' });
  const MANUAL_MIN = 3;
  const active = D.members.filter(m => !m.suspended), off = D.members.length - active.length;
  let period = '3m', filter = 'all', open = null, demoEmpty = false;

  // ---------- الفترة: أرقام الجلسات اللي جواها (الأحدث أولًا زي السجل) ----------
  const PERIODS = [['month', 'الشهر ده'], ['3m', 'آخر 3 شهور'], ['all', 'من الأول']];
  function sessionsIn(p) {
    if (demoEmpty) return [];
    const now = new Date();
    const from = p === 'month' ? new Date(now.getFullYear(), now.getMonth(), 1) : p === '3m' ? new Date(now.getFullYear(), now.getMonth() - 3, now.getDate()) : null;
    return D.sessionDates.map((d, k) => k).filter(k => !from || D.sessionDates[k] >= from);
  }

  // نفس حساب "حضوري": حضر ÷ (الجلسات − الغياب بعذر)
  function stats(m, idx) {
    const h = idx.filter(k => m.log[k] === 'h').length, e = idx.filter(k => m.log[k] === 'e').length;
    const base = idx.length - e;
    return { h, e, base, pct: base ? Math.round(h / base * 100) : null, manual: idx.filter(k => m.manual[k]).length };
  }
  const sessN = n => n === 1 ? 'جلسة واحدة' : n === 2 ? 'جلستين' : n <= 10 ? `${n} جلسات` : `${n} جلسة`;
  const timesN = n => n === 1 ? 'مرة واحدة' : n === 2 ? 'مرتين' : n <= 10 ? `${n} مرات` : `${n} مرة`;

  // ---------- حضور الكل ----------
  function renderAll(idx) {
    // النسبة العامة: مجموع الحضور ÷ مجموع (الجلسات − العذر) لكل المخدومين
    let h = 0, base = 0;
    active.forEach(m => { const s = stats(m, idx); h += s.h; base += s.base; });
    const pct = base ? Math.round(h / base * 100) : 0;
    const perSess = idx.map(k => active.filter(m => m.log[k] === 'h').length);
    const avg = Math.round(perSess.reduce((a, b) => a + b, 0) / perSess.length);
    $('#headline').innerHTML = `نسبة الحضور <b><bdi dir="ltr">${pct}%</bdi></b>`;
    $('#headSub').textContent = `في ${sessN(idx.length)}، بيحضر في المتوسط ${avg} من ${active.length} مخدوم.`;
    // الأحدث على اليمين، زي رسم الشهور في "حضوري"
    const max = active.length, ord = idx;
    $('#strip').innerHTML = ord.map(k => `<i class="${D.sessionTypes[k] === 'mass' ? 'mass' : ''}" style="height:${Math.max(3, perSess[idx.indexOf(k)] / max * 100)}%" title="${D.TYPES[D.sessionTypes[k]]} ${fShort.format(D.sessionDates[k])}: ${perSess[idx.indexOf(k)]}"></i>`).join('');
    $('#strip').setAttribute('aria-label', 'عدد الحاضرين في كل جلسة: ' + ord.map(k => `${D.TYPES[D.sessionTypes[k]]} ${fShort.format(D.sessionDates[k])} ${perSess[idx.indexOf(k)]}`).join('، '));
    $('#axFrom').textContent = fShort.format(D.sessionDates[ord[0]]);
    $('#axTo').textContent = ord.length > 1 ? fShort.format(D.sessionDates[ord[ord.length - 1]]) : '';
    // نسبة كل نوع نشاط
    $('#types').innerHTML = Object.entries(D.TYPES).map(([t, name]) => {
      const ti = idx.filter(k => D.sessionTypes[k] === t);
      let th = 0, tb = 0; active.forEach(m => { const s = stats(m, ti); th += s.h; tb += s.base; });
      const p = tb ? Math.round(th / tb * 100) : null;
      return `<div class="t-row${p === null ? ' none' : ''}"><span>${name}<small>${ti.length ? sessN(ti.length) : 'مفيش'}</small></span><span class="t-bar" aria-hidden="true"><span style="width:${p || 0}%"></span></span><b>${p === null ? '–' : p + '%'}</b></div>`;
    }).join('');
  }

  // ---------- كل مخدوم ----------
  function renderList(idx) {
    const rows = active.map(m => ({ m, s: stats(m, idx) }));
    const many = rows.filter(r => r.s.manual >= MANUAL_MIN);
    const F = [['all', 'الأقل حضورًا', null], ['name', 'بالاسم', null], ['manual', 'يدوي كتير', many.length]];
    $('#filter').innerHTML = F.map(([k, t, n]) => `<button type="button" data-f="${k}" aria-pressed="${k === filter}">${t}${n === null ? '' : ` <b>${n}</b>`}</button>`).join('');
    let L = filter === 'manual' ? many.sort((a, b) => b.s.manual - a.s.manual)
      : filter === 'name' ? rows.sort((a, b) => a.m.name.localeCompare(b.m.name, 'ar'))
      : rows.sort((a, b) => (a.s.pct ?? 101) - (b.s.pct ?? 101) || a.m.name.localeCompare(b.m.name, 'ar'));
    $('#listCount').textContent = `${active.length} مخدوم`;
    $('#noteOff').textContent = off ? `${off === 1 ? 'مخدوم واحد موقوف مش' : off + ' موقوفين مش'} داخل في الأرقام.` : '';
    $('#list').innerHTML = L.length ? L.map(({ m, s }) => {
      const isOpen = open === m.id;
      const meta = s.base ? `حضر ${s.h} من ${s.base}` : 'مفيش جلسات له';
      const flag = s.manual >= MANUAL_MIN ? `<span class="flag">يدوي ${s.manual}</span>` : s.manual ? `<span>· يدوي ${s.manual}</span>` : '';
      return `<div class="m${isOpen ? ' open' : ''}">
        <button class="m-btn" type="button" data-id="${m.id}" aria-expanded="${isOpen}" aria-controls="mm-${m.id}">
          <span class="av" aria-hidden="true">${D.initials(m.name)}</span>
          <span><span class="m-name">${m.name}</span><span class="m-meta"><span>${meta}</span>${flag}</span></span>
          <span class="ring${s.pct === null ? ' na' : s.pct < 60 ? ' low' : ''}" style="--p:${s.pct || 0}" aria-label="نسبة الحضور ${s.pct === null ? 'مفيش' : s.pct + '%'}"><span>${s.pct === null ? '–' : s.pct + '%'}</span></span>
        </button>
        <div class="m-more" id="mm-${m.id}">${isOpen ? detail(m, idx, s) : ''}</div>
      </div>`;
    }).join('') : `<p class="no-match">مفيش حد اتسجّل يدوي ${timesN(MANUAL_MIN)} أو أكتر في الفترة دي. الكروت شغالة.</p>`;
  }

  // تفاصيل مخدوم: نسبة كل نوع، ورسم آخر 6 شهور (نفس اللي في "حضوري")، والتسجيل اليدوي
  function detail(m, idx, s) {
    const types = Object.entries(D.TYPES).map(([t, name]) => {
      const p = stats(m, idx.filter(k => D.sessionTypes[k] === t)).pct;
      return `<div><b>${p === null ? '–' : p + '%'}</b><span>${name}</span></div>`;
    }).join('');
    const now = new Date(), months = Array.from({ length: 6 }, (_, k) => new Date(now.getFullYear(), now.getMonth() - k, 1));
    const data = months.map(d => {
      const mi = D.sessionDates.map((x, k) => k).filter(k => D.sessionDates[k].getMonth() === d.getMonth() && D.sessionDates[k].getFullYear() === d.getFullYear());
      return { d, pct: stats(m, mi).pct };
    });
    const bars = data.map((x, k) => `<div class="bar${k === 0 ? ' now' : ''}${x.pct === null ? ' none' : ''}"><em>${x.pct === null ? '–' : x.pct + '%'}</em><i style="height:${x.pct === null ? 4 : Math.max(6, x.pct)}%"></i><span>${fMonth.format(x.d)}</span></div>`).join('');
    const label = 'نسبة كل شهر: ' + data.map(x => `${fMonth.format(x.d)} ${x.pct === null ? 'مفيش جلسات' : x.pct + '%'}`).join('، ');
    const manual = s.manual
      ? `اتسجّل يدوي <b>${timesN(s.manual)}</b> من ${s.h} حضور في الفترة دي.${s.manual >= MANUAL_MIN ? ' غالبًا الكارت مش معاه، ابعتهوله تاني.' : ''}`
      : 'كل حضوره اتسجّل بمسح الكارت.';
    return `<div><h3>نسبته في كل نوع</h3><div class="mini">${types}</div></div>
      <div><h3>آخر 6 شهور</h3><div class="bars" role="img" aria-label="${label}">${bars}</div></div>
      <p class="manual-t">${manual}</p>
      <div class="m-acts">
        ${s.manual >= MANUAL_MIN ? `<a class="wa" href="${D.waCard(m)}" target="_blank" rel="noopener"><svg class="icon"><use href="#i-wa"/></svg>ابعتله الكارت تاني</a>` : ''}
        <a class="go" href="attend-member.html?id=${m.id}">افتح ملفه<svg class="icon"><use href="#i-left"/></svg></a>
      </div>`;
  }

  function render() {
    $('#period').innerHTML = PERIODS.map(([k, t]) => `<button type="button" data-p="${k}" aria-pressed="${k === period}">${t}</button>`).join('');
    const idx = sessionsIn(period);
    if (!idx.length) { body.dataset.empty = ''; return; }
    delete body.dataset.empty;
    renderAll(idx); renderList(idx);
  }

  $('#period').addEventListener('click', e => { const b = e.target.closest('[data-p]'); if (!b) return; period = b.dataset.p; render(); });
  $('#filter').addEventListener('click', e => { const b = e.target.closest('[data-f]'); if (!b) return; filter = b.dataset.f; open = null; render(); });
  $('#list').addEventListener('click', e => {
    const b = e.target.closest('.m-btn'); if (!b) return;
    const id = +b.dataset.id; open = open === id ? null : id; render();
    $(`.m-btn[data-id="${id}"]`).focus();
  });

  // ---------- حالات المراجعة ----------
  const chips = $$('.review .chip');
  chips.forEach(c => c.addEventListener('click', () => {
    chips.forEach(x => x.setAttribute('aria-pressed', x === c));
    demoEmpty = c.dataset.show === 'empty';
    open = null; render();
  }));

  render();
})();
</script>
</body>
</html>
